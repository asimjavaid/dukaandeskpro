<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>DukaanDesk Pro · Activation</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; background: #faf6f1; color: #2c1810; display: grid; place-items: center; min-height: 100vh; }
  .card { width: 520px; background: #fffaf5; border: 1px solid #e8d9c8; border-radius: 16px; padding: 24px 28px; box-shadow: 0 4px 16px rgba(61,40,23,.08); }
  h1 { font-size: 20px; margin: 0 0 4px; } .muted { color: #6b4f3a; margin: 0 0 12px; }
  .code { display: flex; gap: 10px; align-items: center; margin: 6px 0 16px; }
  .code b { font: 700 24px/1.2 Consolas, ui-monospace, monospace; letter-spacing: 2px; background: #f0e6db; padding: 8px 12px; border-radius: 10px; user-select: all; }
  label { font-weight: 600; font-size: 13px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 90px; font: 13px/1.4 Consolas, monospace; border: 1px solid #d4b896; border-radius: 10px; padding: 8px; background: #fff; }
  button { font: 600 14px system-ui; border-radius: 10px; padding: 8px 16px; border: 1px solid #d4b896; background: #fffaf5; color: #2c1810; cursor: pointer; }
  button.primary { background: #0f766e; color: #fff; border-color: #0f766e; } button:disabled { opacity: .5; }
  .msg { padding: 8px 12px; border-radius: 10px; margin-top: 10px; display: none; } .err { background: #fee2e2; color: #b91c1c; display: block; } .ok { background: #dcfce7; color: #15803d; display: block; }
  ol { padding-left: 20px; color: #6b4f3a; margin: 0 0 12px; }
</style>
</head>
<body>
<div class="card">
  <h1 id="h">Your 14-day trial has ended</h1>
  <p class="muted" id="sub">Your shop data is safe. Activate to keep using DukaanDesk Pro.</p>
  <ol><li>Send this Machine Code to your DukaanDesk Pro seller with your payment.</li><li>Paste the activation key you receive below.</li></ol>
  <label>Machine Code</label>
  <div class="code"><b id="mc">…</b><button id="copy">Copy</button></div>
  <label for="key">Activation key</label>
  <textarea id="key" spellcheck="false" placeholder="DR2.…"></textarea>
  <div style="margin-top:14px"><button class="primary" id="go" disabled>Activate</button></div>
  <div class="msg" id="msg"></div>
</div>
<script>
  const R = {
    wrong_machine: 'This key was made for a different computer. Send the Machine Code above to get the right key.',
    bad_signature: 'This key is not valid. Please copy the whole key again exactly as sent.',
    bad_format: 'That does not look like a DukaanDesk Pro key. It starts with DR2.',
    no_public_key: 'This copy of DukaanDesk Pro cannot check keys. Please contact the seller.',
  };
  const $ = (id) => document.getElementById(id);
  const msg = (t, ok) => { $('msg').textContent = t; $('msg').className = 'msg ' + (ok ? 'ok' : 'err'); };
  window.ddLicence.status().then((s) => {
    $('mc').textContent = s.machineCode;
    if (s.state === 'clock_rollback') { $('h').textContent = 'Computer date looks wrong'; $('sub').textContent = "The computer's date and time were set back. Fix the date and time in Windows and reopen DukaanDesk Pro, or activate below."; }
  });
  $('copy').onclick = () => window.ddLicence.copy($('mc').textContent).then(() => { $('copy').textContent = 'Copied'; });
  $('key').oninput = () => { $('go').disabled = !$('key').value.trim(); };
  $('go').onclick = async () => {
    $('go').disabled = true;
    const s = await window.ddLicence.activate($('key').value);
    if (s.state === 'licensed') msg('Activated. Thank you! Opening DukaanDesk Pro…', true);
    else { msg(R[s.activationError] || 'Activation failed. Please check the key.'); $('go').disabled = false; }
  };
</script>
</body>
</html>
